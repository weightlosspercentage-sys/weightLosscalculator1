    <script>
      (function() {
        try {
          var realFetch = window.fetch;
          var customFetch = realFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return customFetch;
            },
            set: function(val) {
              customFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // ignore
        }

        window.addEventListener('error', function(event) {
          if (event && event.filename && event.filename.startsWith('chrome-extension://')) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
          if (event && event.message && event.message.includes('Cannot set property fetch of #<Window>')) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
